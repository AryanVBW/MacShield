name: Build (Manual)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - Both

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build Debug
        if: ${{ inputs.configuration == 'Debug' || inputs.configuration == 'Both' }}
        run: |
          xcodebuild build \
            -project MacShield.xcodeproj \
            -scheme MacShield \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Build Release
        if: ${{ inputs.configuration == 'Release' || inputs.configuration == 'Both' }}
        run: |
          xcodebuild build \
            -project MacShield.xcodeproj \
            -scheme MacShield \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
